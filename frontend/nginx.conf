# Serves the built React app and forwards /api to the backend, so the browser sees
# one origin and the SameSite=Strict session cookie works without CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://social:3000;
        client_max_body_size 6m; # image uploads (the API allows 5 MB)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
